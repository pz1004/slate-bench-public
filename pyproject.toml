[project]
name = "tabular-sota-benchmark"
version = "0.1.0"
description = "Audit of score-level selection claims in tabular benchmark artifacts (TabArena, TabRepo)."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
boosters = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
tabbench = "tabular_sota_benchmark.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

